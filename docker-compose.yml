version: '3.8'

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --url http://nginx:80
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 30M

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 20M

  broker:
    image: eclipse-mosquitto:latest
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config/mosquitto.conf:/mosquitto/config/mosquitto.conf
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 15M

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - DB_PATH=${DB_PATH:-/data/radar.db}
      - MQTT_BROKER=${MQTT_BROKER:-broker:1883}
      - ML_SERVICE_URL=http://ml-service:5000/summarize
      - DEFAULT_KEYWORDS=${DEFAULT_KEYWORDS:-swarm robotics, decentralized control, drone vtol}
      - ARXIV_FETCH_INTERVAL=${ARXIV_FETCH_INTERVAL:-@every 6h}
    volumes:
      - ./data:/data
    depends_on:
      - broker
      - ml-service
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 80M

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 100M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 25M

volumes:
  db_data:
