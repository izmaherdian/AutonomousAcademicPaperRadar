; PlatformIO Project Configuration File for ESP32 Desk Assistant
; Autonomous Academic Paper Radar

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    tzapu/WiFiManager @ ^2.0.15-rc.1
    knolleary/PubSubClient @ ^2.8
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 @ ^4.6.1
    bblanchon/ArduinoJson @ ^7.0.4

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D OLED_SDA=21
    -D OLED_SCL=22
    -D BTN_FETCH_PIN=12
    -D BTN_STAR_PIN=14
    -D LED_PIN=2
